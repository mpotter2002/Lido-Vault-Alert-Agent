name: Hourly Alert Broadcast

on:
  schedule:
    - cron: "0 * * * *"   # every hour at :00
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert broadcast
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 3 \
            --retry-all-errors \
            -X POST https://www.lidovaultagent.app/api/telegram-broadcast \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.BROADCAST_SECRET }}" \
            -d '{}' \
            --output "$response_file"

          jq -e '{ sent, skipped, alertCount, criticalCount }' "$response_file"
